name: Dev Test Build
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    paths:
      - 'app/src/main/java/com/dhangofa/xiaomicnapfix/CnapFixHook.java'
  workflow_dispatch:

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # The clean, fast, original approach. No extra plugins needed for Java.
    - name: Compile Release APK using Gradle
      run: gradle assembleRelease

    - name: Decode Permanent Keystore
      run: |
        cat << 'EOF' > encoded_key.txt
        ${{ secrets.KEYSTORE_BASE64 }}
        EOF
        sed -i '/---/d' encoded_key.txt
        tr -d '\r\n ' < encoded_key.txt | base64 --decode > release.keystore

    - name: Zipalign and Sign Release APK (V2 Signature)
      run: |
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        
        $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-aligned.apk
        
        $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --out app/build/outputs/apk/release/Xiaomi_CNAP_Fix.apk app/build/outputs/apk/release/app-release-aligned.apk

    - name: Upload Test APK
      uses: actions/upload-artifact@v4
      with:
        name: Xiaomi-CNAP-Fix-Dev-Test
        path: app/build/outputs/apk/release/Xiaomi_CNAP_Fix.apk
        compression-level: 0
